<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop</title>
  <link rel="stylesheet" href="TopBar.css">
  <link rel="stylesheet" href="index_middle.css">
</head>
<body>

    <div class="top-bar">

    <a href="Index.html" class="top-bar_logo">
      <img src="Img/Company_Logo.png" alt="Company logo">
    </a>

    <a href="Card.html" class="top-bar_cart">
      <img src="Img/shopping_card.webp" alt="Shopping cart">
    </a>

    <div class="top-bar_search">
      <input type="text" placeholder="Search">
      <button type="button" class="top-bar_search-btn">
        <img src="Img/search-icon.png" alt="Search">
      </button>
    </div>

    <div class="top-bar_user">
      <span class="top-bar_name">Name</span>
      <img class="top-bar_avatar" src="Img/Capybara.jpg" alt="Profile picture">
    </div>

  </div>

    <div class="Section">
      <h1 class="Categort_Name">Categories</h1>
      <div class="TwoDiv_Container">
        <a href="#" class="Seletion-Item_Backround">
            <img class="Middle-Item_Img-Small" src="Img/Capybara.jpg" alt="">
            <h4 class="Middle-Item_Text">Capybara_1</h4>
        </a>

      </div>
    </div>

    <div class="Section">
      <h1>Big Deals in Capybaras</h1>
      <div class="TwoDiv_Container">
          <a href="#">
            <div class="Img_Backround">
              <img class="Middle-Item_Img" src="Img/Capybara.jpg" alt="">
            </div>
            <div class="Middle-Item_Div">
              <h3 class="Middle-Item_Text-Left">Capybara_1</h3>
              <h2 class="Middle-Item_Text-Left">139€</h2>
            </div>
          </a>
         
          <a href="#">
            <div class="Img_Backround">
              <img class="Middle-Item_Img" src="Img/Capybara.jpg" alt="">
            </div>
            <div class="Middle-Item_Div">
              <h3 class="Middle-Item_Text-Left">Capybara_1</h3>
              <div class="BlackFriday_Container">
                <div class="BlackFriday_Off">-10% off</div>
                <div class="BlackFriday_Text">Black Friday</div>
              </div>
              <h2 class="Middle-Item_Text-Left">139€</h2>
            </div>
          </a>
      </div>
    </div>

</body>
</html>
